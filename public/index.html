<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice-to-Terminal</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>

  <header>
    <div class="logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#22c55e" stroke-width="2">
        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
        <path d="M2 17l10 5 10-5"/>
        <path d="M2 12l10 5 10-5"/>
      </svg>
      <h1>Voice<span>-to-</span>Terminal</h1>
    </div>
    <div class="user-info" id="user-info"></div>
  </header>

  <!-- ─── Login Screen ─── -->
  <div id="login-screen">
    <h2>Voice-to-Terminal</h2>
    <p>Execute comandos por voz ou texto. O terminal só abre depois da autenticação da conta Google administradora.</p>
    <div class="google-signin" id="google-login-btn"></div>
    <p class="login-status" id="login-status">Preparando login seguro…</p>
    <div id="login-error" class="login-error" hidden></div>
  </div>

  <!-- ─── App Principal ─── -->
  <div id="app" hidden>
    <div id="terminal">
      <div class="line info">Voice-to-Terminal v1.0</div>
      <div class="line info">Diga um comando ou digite abaixo...</div>
      <div class="line info">─</div>
    </div>

    <div class="controls">
      <button class="mic-btn" id="mic-btn" title="Ativar microfone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="22"/>
        </svg>
      </button>
      <span class="status" id="mic-status">Clique no microfone para falar</span>
      <input
        type="text"
        class="cmd-input"
        id="cmd-input"
        placeholder="Ou digite um comando..."
      />
      <button class="send-btn" id="send-btn">Executar</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js" defer></script>
  <script src="/app.js" defer></script>

</body>
</html>
